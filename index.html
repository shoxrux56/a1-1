*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;font-weight:700;font-size:17px;line-height:1.4}
#app{max-width:600px;margin:0 auto;height:100%;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.top{display:flex;align-items:center;gap:14px;padding:18px 16px 8px}
.bar{flex:1;height:16px;border-radius:9px;background:var(--line);overflow:hidden}

.hp{color:var(--r);font-weight:900}

.uz{font-size:19px;margin:0 0 18px}
.say{background:var(--bl);color:var(--bd);border-radius:12px;padding:6px 10px;border-bottom:3px solid var(--b);margin-left:6px;font-size:15px}

.ru{font-size:21px;font-weight:900}
.tag{display:inline-block;border-radius:10px;padding:2px 10px;font-weight:900;color:#fff;margin-right:6px}
.tag.g{background:var(--g)}.tag.b{background:var(--b)}.tag.y{background:var(--y);color:#3c3c3c}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols .card{margin:0}
.cols ul{list-style:none;padding:0;margin:8px 0 0}
.cols li{padding:5px 0;font-size:18px}
.end{color:var(--rt);font-weight:900}
.tip{background:var(--bl);border-radius:16px;padding:12px 14px;margin-top:14px}
table{width:100%;border-collapse:collapse}
td,th{padding:9px 6px;text-align:left;border-bottom:2px solid var(--line)}
th{color:var(--mut);font-size:14px}
.sent{font-size:26px;font-weight:900;margin:0 0 22px;line-height:1.8}
.bl{display:inline-block;min-width:70px;border-bottom:4px solid var(--line);text-align:center;color:var(--bd);margin:0 4px}
.opts{display:grid;gap:12px}

.opt:active,.w:active{transform:translateY(3px);border-bottom-width:2px}

.ans{min-height:112px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:8px 0;border-top:2px solid var(--line);border-bottom:2px solid var(--line);margin-bottom:22px;background:repeating-linear-gradient(transparent 0 54px,var(--line) 54px 56px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.w.used{opacity:.25;pointer-events:none}
footer{padding:14px 20px calc(18px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--line)}
footer.ok{background:var(--gl);border-color:transparent;color:var(--gt)}
footer.bad{background:var(--rl);border-color:transparent;color:var(--rt)}
footer p{margin:0 0 12px;font-weight:900}
footer .h{font-size:15px;font-weight:700}
.btn{width:100%;padding:15px;border-radius:16px;color:#fff;font-weight:900;font-size:18px;background:var(--g);border-bottom:5px solid var(--gd)}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn:disabled{background:var(--line);color:var(--mut);border-bottom-color:var(--line);cursor:default}
footer.bad .btn{background:var(--r);border-bottom-color:var(--rd)}
.btn.bb{background:var(--b);border-bottom-color:var(--bd)}
.fin{text-align:center;padding-top:20px}
.stars{font-size:56px;letter-spacing:6px}
.stats{display:flex;gap:12px;justify-content:center;margin:20px 0}
.stat{border:2px solid var(--y);border-radius:16px;min-width:110px;overflow:hidden}
.stat span{display:block;background:var(--y);color:#3c3c3c;font-size:13px;padding:3px}

.shake{animation:sh .35s}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.sent{font-size:23px}.ru{font-size:19px}}

.tm{height:9px;border-radius:5px;background:var(--line);overflow:hidden;margin:0 0 16px}.tm i{display:block;height:100%;background:var(--y);transform-origin:left;animation:tm 12s linear forwards}@keyframes tm{to{transform:scaleX(0);background:#ff4b4b}}

.cf{position:fixed;left:50%;bottom:120px;font-size:26px;pointer-events:none;z-index:9}
.nd{display:flex;flex-direction:column;align-items:center;gap:2px}.nd span{font-weight:900;font-size:15px}.nd small{min-height:18px}.node.fin5:not(.lock){background:var(--y);border-bottom-color:#cc9a00}
.sd{color:var(--gt);font-weight:900;border-bottom:3px solid var(--g)}.sg{color:var(--bd);font-weight:900;border-bottom:3px solid var(--b)}.ex{margin-bottom:6px}
.stage{position:relative;height:130px;perspective:420px;margin:10px 0 16px;overflow:hidden;border-radius:18px;background:var(--bl)}
.gr{position:absolute;left:-10%;right:-10%;bottom:-6px;height:64px;background:linear-gradient(#89e219,#58cc02);transform:rotateX(58deg);transform-origin:bottom}
.bd{position:absolute;left:58%;bottom:34px;font-size:64px;line-height:1;z-index:2;transform:rotateY(-14deg);filter:drop-shadow(8px 8px 0 rgba(0,0,0,.14))}
.tb{position:absolute;left:54%;bottom:30px;width:84px;height:36px;border-radius:8px;background:#c98b45;border-bottom:6px solid #a06a2c;z-index:1}
.ch{position:absolute;bottom:34px;left:6%;font-size:44px;line-height:1;z-index:1}
.ch i{display:block;font-style:normal;transform:scaleX(-1);animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{to{transform:scaleX(-1) translateY(-5px)}}
.cap{position:absolute;left:10px;top:8px;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:1px 10px;font-size:16px;font-weight:900;z-index:3}
.c-in{animation:kin 4s ease-in-out infinite}.c-on{animation:kon 4s ease-in-out infinite}.c-za{animation:kza 4s ease-in-out infinite}

@keyframes kon{0%{left:6%;bottom:34px;opacity:0}8%{opacity:1}45%{left:42%;bottom:34px}58%{left:56%;bottom:88px}66%,88%{left:58%;bottom:66px;opacity:1}100%{left:58%;bottom:66px;opacity:0}}
@keyframes kza{0%{left:6%;opacity:0}8%{opacity:1}55%,90%{left:62%;opacity:1}100%{left:62%;opacity:0}}
.sm{background:var(--bl);color:var(--bd);border-radius:12px;padding:6px 10px;border-bottom:3px solid var(--b);margin-left:6px;font-size:15px}
.mic{width:96px;height:96px;border-radius:50%;background:var(--b);border-bottom:7px solid var(--bd);font-size:42px;color:#fff}.mic.on{background:var(--r);border-bottom-color:var(--rd);animation:pl .7s infinite alternate}@keyframes pl{to{transform:scale(1.12)}}
</style>

/* ===== OVOZ TIZIMI ===== */
var SOUND=false,AC=null,VOICES=[];

function ctx(){
  if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}

function snd(ok){
  if(!SOUND)return;
  try{
    var c=ctx();if(!c)return;
    var o=c.createOscillator(),g=c.createGain(),t=c.currentTime;
    o.connect(g);g.connect(c.destination);
    o.type=ok?'triangle':'sawtooth';
    o.frequency.setValueAtTime(ok?660:170,t);
    if(ok)o.frequency.setValueAtTime(880,t+.1);
    g.gain.setValueAtTime(.15,t);
    g.gain.exponentialRampToValueAtTime(.001,t+.3);
    o.start(t);o.stop(t+.3);
  }catch(e){}
}

function loadV(){try{VOICES=speechSynthesis.getVoices()}catch(e){}}
if('speechSynthesis' in window){loadV();speechSynthesis.onvoiceschanged=loadV}


function say(t){
  if(!SOUND)return;
  var hasRu=VOICES.some(function(x){return /^ru/i.test(x.lang)});
  if(!hasRu||!('speechSynthesis' in window))return;
  var u=new SpeechSynthesisUtterance(t),started=false;
  u.lang='ru-RU';u.rate=.85;
  u.voice=VOICES.filter(function(x){return /^ru/i.test(x.lang)})[0];
  u.onstart=function(){started=true};
  
  window._u=u;
  speechSynthesis.cancel();
  setTimeout(function(){speechSynthesis.speak(u)},80);
}

function unlock(){
  ctx();
  try{var u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}
}
